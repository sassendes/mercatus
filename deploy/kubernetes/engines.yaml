apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercatus-search
  labels:
    app.kubernetes.io/name: mercatus
    app.kubernetes.io/component: search
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: mercatus
      app.kubernetes.io/component: search
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mercatus
        app.kubernetes.io/component: search
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: search
          image: mercatus
          command: ["/usr/local/bin/search-engine"]
          ports:
            - { name: http, containerPort: 8092 }
          env:
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: mercatus, key: INTERNAL_TOKEN }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: mercatus-search
spec:
  selector:
    app.kubernetes.io/name: mercatus
    app.kubernetes.io/component: search
  ports:
    - { name: http, port: 8092, targetPort: http }
---
